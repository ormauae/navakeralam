name: Sync from Google Sheets

on:
  workflow_dispatch:        # manual trigger from GitHub UI
  schedule:
    - cron: '0 3 * * *'    # daily at 3 AM UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync data from Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/sync_from_sheets.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/departments.json
          git diff --staged --quiet || git commit -m "chore: sync departments from Google Sheets"
          git push
